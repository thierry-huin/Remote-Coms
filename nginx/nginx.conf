server {
    listen 9080;
    server_name _;

    # HLS-only plain-HTTP fallback: some Smart TV browsers (WebOS's native
    # HLS/video pipeline, not just its Chromium-based page renderer) and
    # VLC's per-segment TLS handling can't practically work with our
    # self-signed cert -- WebOS has no user-facing "trust this certificate"
    # screen at all on consumer models, and VLC ends up looping the accept
    # prompt forever (see the diagnosis this was added for). Exposing ONLY
    # the HLS viewing path unencrypted sidesteps that entirely for TVs/VLC,
    # using the exact same unguessable-key model as everything else here --
    # every other route (admin panel, WS signaling, login, API) still
    # requires HTTPS and keeps redirecting below. To use this from a TV/VLC,
    # take the normal HLS link and swap "https://host:9443/" for
    # "http://host:9080/".
    location = /hls.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /hls.min.js {
        root /usr/share/nginx/html;
    }
    location /api/hls-info {
        proxy_pass http://video-backend:3100/api/hls-info;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ \.m3u8$ {
        root /usr/share/nginx;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location /hls/ {
        root /usr/share/nginx;
        add_header Cache-Control "public, max-age=30" always;
    }

    # Everything else (admin panel, API, WS, login) stays HTTPS-only.
    location / {
        return 301 https://$host:9443$request_uri;
    }
}

server {
    listen 9443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # WebSocket to backend
    location /ws {
        proxy_pass http://video-backend:3100/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # API
    location /api/ {
        proxy_pass http://video-backend:3100/api/;
        # $http_host (not $host): $host strips the port, which broke
        # req.get('host')-based URL building on the backend (e.g. the guest
        # stream link ended up missing ":9443").
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health
    location /health {
        proxy_pass http://video-backend:3100/health;
    }

    # HLS output (see backend/src/services/hls-manager.js, which writes
    # segments/playlist into the shared hls-data volume mounted here
    # read-only). Playlists must never be cached (the player needs the
    # latest segment list every few seconds); segments are immutable once
    # written (each has a unique numbered filename) so a short cache is fine
    # and reduces load if the same TV re-requests one.
    location ~ \.m3u8$ {
        root /usr/share/nginx;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location /hls/ {
        root /usr/share/nginx;
        add_header Cache-Control "public, max-age=30" always;
    }

    # Static web files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
