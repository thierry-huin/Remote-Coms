# Coturn TURN server configuration for Winus Video
# listening-port is overridden by --listening-port in docker-compose.yml
# so each deployment can set TURN_PORT in .env (default: 3480)
listening-port=3480
fingerprint
lt-cred-mech
realm=winus-video
server-name=winus-video

# Relay port range (inside container). Deliberately different from Winus
# Intercom's own coturn (49152-49200) so both can run side by side on the
# same host without a port clash, even though winus-video no longer
# depends on Intercom's TURN server being present.
min-port=49201
max-port=49250

# Logging
log-file=stdout
verbose

# Allocation lifetime
max-allocate-lifetime=3600
user-quota=100
total-quota=300

# No TLS for now (TURN over plain UDP/TCP)
no-tls
no-dtls

# Disable CLI
no-cli
